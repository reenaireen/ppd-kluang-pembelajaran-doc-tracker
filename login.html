<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - Document Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FDFBF7] flex items-center justify-center min-h-screen text-gray-800">

    <div class="bg-white border border-[#E5E0D5] p-8 rounded-xl shadow-sm w-full max-w-md">
        <h1 class="text-2xl font-bold text-[#6A1B29] mb-6 text-center">Staff Sign In</h1>

        <form action="login.php" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" name="email" required placeholder="staff@organization.com" class="w-full px-4 py-2 border border-[#E5E0D5] rounded-lg focus:ring-2 focus:ring-[#6A1B29]">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full px-4 py-2 border border-[#E5E0D5] rounded-lg focus:ring-2 focus:ring-[#6A1B29]">
            </div>

            <button type="submit" class="w-full bg-[#6A1B29] text-[#FDFBF7] py-2 rounded-lg font-semibold hover:bg-[#52131F] transition">Sign In</button>
        </form>

        <p class="text-center text-sm text-gray-600 mt-6">
            Don't have an account? 
            <a href="signup.html" class="text-[#6A1B29] font-semibold hover:underline">Sign Up</a>
        </p>
        
        <div class="text-center mt-4">
            <a href="index.html" class="text-sm text-gray-500 hover:underline"></a>
        </div>
    </div>

</body>
</html>
