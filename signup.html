<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Document Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    function handleRoleChange() {
        var roleSelect = document.getElementById('role_select');
        var passcodeBox = document.getElementById('passcode_box');
        var passcodeInput = document.getElementById('passcode_input');

        if (roleSelect.value === 'staff') {
            passcodeBox.classList.remove('hidden');
            passcodeInput.required = true;
        } else {
            passcodeBox.classList.add('hidden');
            passcodeInput.required = false;
            passcodeInput.value = '';
        }
    }
    </script>
</head>
<body class="bg-[#FDFBF7] text-gray-800 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white border border-[#E5E0D5] p-8 rounded-xl shadow-sm w-full max-w-md">
        <h2 class="text-2xl font-bold text-[#6A1B29] mb-2 text-center">Create Account</h2>
        <p class="text-sm text-gray-500 text-center mb-6">Sign up to submit tasks or manage documents</p>

        <form action="signup.php" method="POST" class="space-y-4">
            <!-- Full Name -->
            <div>
                <label class="block text-sm font-medium mb-1">Full Name</label>
                <input type="text" name="full_name" required class="w-full px-4 py-2 border border-[#E5E0D5] rounded-lg focus:ring-2 focus:ring-[#6A1B29] outline-none">
            </div>

            <!-- Role Selection -->
            <div>
                <label class="block text-sm font-medium mb-1">Account Role</label>
                <select name="role" id="role_select" onchange="handleRoleChange()" required class="w-full px-4 py-2 border border-[#E5E0D5] rounded-lg bg-white font-semibold focus:ring-2 focus:ring-[#6A1B29] outline-none">
                    <option value="timbalan">Choose your role</option>
                    <option value="timbalan">Timbalan Sektor Pembelajaran</option>
                    <option value="staff">Staff</option>
                    <option value="requester">Requester</option>
                  
                </select>
            </div>

            <!-- Email Address -->
            <div>
                <label class="block text-sm font-medium mb-1">Email Address</label>
                <input type="email" name="email" required class="w-full px-4 py-2 border border-[#E5E0D5] rounded-lg focus:ring-2 focus:ring-[#6A1B29] outline-none">
            </div>

            <!-- Password -->
            <div>
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" name="password" required class="w-full px-4 py-2 border border-[#E5E0D5] rounded-lg focus:ring-2 focus:ring-[#6A1B29] outline-none">
            </div>

            <!-- Staff Passcode Field (Only visible when Staff role is chosen) -->
            <div id="passcode_box" class="hidden transition-all duration-300">
                <label class="block text-sm font-bold text-[#6A1B29] mb-1">Staff Access Passcode</label>
                <input type="password" id="passcode_input" name="passcode" placeholder="Enter staff secret key" class="w-full px-4 py-2 border border-[#6A1B29] bg-red-50 rounded-lg focus:ring-2 focus:ring-[#6A1B29] outline-none">
            </div>

            <button type="submit" class="w-full bg-[#6A1B29] text-white py-2 rounded-lg font-semibold hover:bg-[#52131F] transition mt-2">Sign Up</button>
        </form>

        <p class="text-xs text-center text-gray-500 mt-6">
            Already have an account? <a href="login.html" class="text-[#6A1B29] font-bold hover:underline">Log in here</a>
        </p>
    </div>

</body>
</html>
